server:
  port: 8080
  include-debug-info: true
  error:
    include-message: always

spring:
  application:
    name: baseball
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
        options:
          temperature: 0.2
  datasource:
    driverClassName: org.h2.Driver
    username: sa
    password:
    url: jdbc:h2:mem:housedb
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  config:
    use-legacy-processing: true
  h2:
    console:
      enabled: true
