info:
  name: LLM_Simple_Chat
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/v1/chat/simple
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "user_prompt": "Why sun is hot"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
